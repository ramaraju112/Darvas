<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Darvas V7.4</title><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script><style>
:root{font-family:Inter,Segoe UI,Arial,sans-serif;color:#e6edf7;background:#0b1220}*{box-sizing:border-box}body{margin:0}header{padding:18px 24px;background:#101c30;border-bottom:1px solid #26344b;display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}h1{font-size:22px;margin:0}small,.muted{color:#9aabc2}nav{display:flex;gap:6px;flex-wrap:wrap;padding:12px 18px;background:#0e192a;border-bottom:1px solid #26344b}button{background:#233650;color:#eef5ff;border:1px solid #385273;border-radius:8px;padding:10px 13px;cursor:pointer}button:hover{background:#345278}button.active,.primary{background:#2463c7;border-color:#3678e2}button:disabled{opacity:.5;cursor:wait}main{max-width:1400px;margin:auto;padding:22px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.card{border:1px solid #293c55;background:#142238;border-radius:12px;padding:18px;margin-bottom:14px}.card h3{margin-top:0}.metric{font-size:27px;font-weight:700;margin:8px 0}.tag{display:inline-block;padding:5px 9px;border-radius:20px;background:#35465e;font-size:12px}.warn{background:#6d4a1d;color:#ffe3aa}.danger{background:#6a2b3a;color:#ffd7df}.good{background:#1b544a;color:#bdf6e5}input,textarea,select{padding:10px;border-radius:8px;border:1px solid #455a73;background:#0b1729;color:white;max-width:100%;font:inherit}input[type=text]{min-width:240px}textarea{width:100%;min-height:105px}table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:11px;border-bottom:1px solid #2a3a52;text-align:left}th{color:#9aabc2}tr:hover{background:#1c304b}.scroll{overflow:auto}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0b1729;padding:12px;border-radius:8px;color:#bfd6f4}.split{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:850px){.split{grid-template-columns:1fr}}#notice{padding:10px 22px;display:none;background:#254a63}a{color:#86b6ff}canvas{max-height:340px}label{display:block;margin:8px 0}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.spaced{justify-content:space-between}
</style></head><body><header><div><h1>◈ DARVAS V7.4 <span class="tag">BROWSER MVP</span></h1><small>Portfolio Intelligence · Darvas · Early Recovery</small></div><div class="row"><span class="tag warn">RESEARCH ONLY</span><span class="tag">Schwab disconnected</span><span class="tag">No live feed</span></div></header><nav id="nav"></nav><div id="notice"></div><main id="app"></main><script>
const pages=[['home','Command Center'],['data','Market Data'],['scan','Darvas & Recovery'],['portfolio','Portfolio'],['research','AI Research'],['backtest','History & Backtest'],['alerts','Telegram & Alerts']];let page='home',cached={},chart=null;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=x=>x==null?'—':Number(x).toLocaleString('en-US',{maximumFractionDigits:2});
async function api(path,opts){let r=await fetch('/api'+path,opts);let j=await r.json();if(!r.ok)throw Error(j.detail||r.statusText);return j}function notice(s,bad=false){let e=$('notice');e.textContent=s;e.style.display='block';e.style.background=bad?'#683347':'#254a63'}function nav(){ $('nav').innerHTML=pages.map(([id,name])=>`<button class="${page===id?'active':''}" onclick="go('${id}')">${name}</button>`).join('')}async function go(p){page=p;nav();$('app').innerHTML='<div class="card">Loading…</div>';try{await views[p]()}catch(e){$('app').innerHTML='<div class="card">Error: '+esc(e.message)+'</div>';notice(e.message,true)}}function table(headers,rows){return `<div class="scroll"><table><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.join('')||`<tr><td colspan="${headers.length}">No records yet</td></tr>`}</tbody></table></div>`}
const views={
async home(){let s=await api('/status');let ps=await api('/portfolio');let total=ps.positions.reduce((a,p)=>a+(p.value||0),0),pnl=ps.positions.reduce((a,p)=>a+(p.pnl||0),0);$('app').innerHTML=`<h2>Investment Command Center</h2><div class="grid"><div class="card"><small>Imported portfolio value (last stored close)</small><div class="metric">$${fmt(total)}</div><small>Unrealized P/L: $${fmt(pnl)}</small></div><div class="card"><small>Positions imported</small><div class="metric">${ps.positions.length}</div><small>Protection status: unknown</small></div><div class="card"><small>Symbols stored</small><div class="metric">${s.symbols.length}</div><small>Historical daily OHLCV</small></div><div class="card"><small>Telegram</small><div class="metric">${s.telegram_configured?'Configured':'Offline'}</div><small>No automatic monitoring</small></div></div><div class="split"><div class="card"><h3>Next actions</h3><p>1. Download starter historical prices.</p><p>2. Run research-only scanners.</p><p>3. Import portfolio CSV.</p><p>4. Review charts and research briefs.</p><button class="primary" onclick="go('data')">Start with Market Data</button></div><div class="card"><h3>System limitations</h3><p>Market-wide coverage: <span class="tag warn">Not verified</span></p><p>Schwab order checks: <span class="tag warn">Unavailable</span></p><p>Automated risk alerts: <span class="tag warn">Unavailable</span></p><p>Trading: <span class="tag good">Disabled</span></p><p class="muted">Render Free may spin down after inactivity; automatic monitoring is not enabled.</p></div></div>`},
async data(){let s=await api('/status');$('app').innerHTML=`<h2>Historical Market Data</h2><div class="card"><h3>Download daily OHLCV</h3><p class="muted">Unofficial Yahoo Finance source. Free availability and bulk usage are not guaranteed. Up to 150 symbols per request.</p><label>Symbols (comma separated)</label><input id="syms" type="text" style="width:80%" value="ORCL,ACN,INTC,NKE,SEZL,MSFT,NVDA,PLTR,AMD,META,AMZN,AVGO,SPY,QQQ"><label>History <select id="period"><option>10y</option><option>5y</option><option>2y</option><option>1y</option><option>max</option></select></label><button class="primary" id="download" onclick="download()">Download / update</button><pre id="dlout">No download started.</pre></div><div class="card"><h3>Stored data coverage</h3><div id="coverage">${table(['Symbol','Bars','First date','Last date'],s.symbols.map(x=>`<tr><td>${esc(x.symbol)}</td><td>${fmt(x.bars)}</td><td>${esc(x.first_day)}</td><td>${esc(x.last_day)}</td></tr>`))}</div></div>`},
async scan(){let x=await api('/scan');cached.scan=x;$('app').innerHTML=`<h2>Independent Strategy Monitors</h2><p class="tag warn">Research only — two independent provisional engines, no verified entries</p><div class="grid"><div class="card"><small>Symbols screened</small><div class="metric">${x.scanned}</div></div><div class="card"><small>Classic Darvas provisional watches</small><div class="metric">${x.darvas.length}</div></div><div class="card"><small>Early Recovery discoveries</small><div class="metric">${(x.recovery_discovery||[]).length}</div></div><div class="card"><small>Early Recovery volume-confirmed watches</small><div class="metric">${x.recovery.length}</div></div></div><div class="card"><h3>Strategy A — Classic Darvas (provisional)</h3><p class="muted">20-session high/depth heuristic only. Confirmed boxes, pivots and breakout entries are NOT implemented. Recovery rules do not affect this list.</p>${sigtable(x.darvas,'darvas')}</div><div class="card"><h3>Strategy B — Early Recovery Discovery</h3><p class="muted">Independent research candidates: prior decline ≥20%, positive HMA38 slope, price above HMA38. No Darvas base-depth requirement. Discovery is NOT a buy signal.</p>${sigtable(x.recovery_discovery||[],'recovery')}</div><div class="card"><h3>Early Recovery — Volume-Confirmed Watch</h3><p class="muted">Subset of discoveries with RVOL20 ≥1.0; still NOT an entry signal.</p>${sigtable(x.recovery,'recovery')}</div><div class="card"><h3>All Symbols — Independent Status and Reasons</h3>${sigtable(x.all,'both')}</div><p class="muted">${esc(x.disclaimer)}</p>`},
async portfolio(){let x=await api('/portfolio');$('app').innerHTML=`<h2>Portfolio Intelligence</h2><div class="card"><h3>Import Schwab-style CSV</h3><p>Required headers: <code>symbol,quantity,cost_basis</code>. Optional: <code>horizon,thesis</code>. Import replaces the previous local portfolio. No brokerage login required.</p><input id="portfoliofile" type="file" accept=".csv"><button class="primary" onclick="upload()">Import CSV</button><p class="muted">You can test using sample_portfolio.csv included in the ZIP.</p></div><div class="card"><h3>All imported holdings</h3>${table(['Ticker','Shares','Avg cost','Last price','Price date','Value','P/L','Protection'],x.positions.map(p=>`<tr><td><button onclick="researchFor('${esc(p.symbol)}')">${esc(p.symbol)}</button></td><td>${fmt(p.quantity)}</td><td>$${fmt(p.cost_basis)}</td><td>${p.price==null?'—':'$'+fmt(p.price)}</td><td>${esc(p.price_date||'No price')}</td><td>${p.value==null?'—':'$'+fmt(p.value)}</td><td>${p.pnl==null?'—':'$'+fmt(p.pnl)}</td><td><span class="tag warn">UNKNOWN</span></td></tr>`))}</div><p class="muted">Stored closes are not live quotes. No stops or working orders are connected; no intraday protection is provided.</p>`},
async research(){let symbol=cached.researchSymbol||'ORCL';$('app').innerHTML=`<h2>Research Notebook</h2><div class="card"><div class="row"><input type="text" id="researchSymbol" value="${esc(symbol)}" placeholder="Ticker"><button onclick="loadResearch()">Load research</button></div><div id="researchBody" style="margin-top:15px"></div></div>`;await loadResearch()},
async backtest(){$('app').innerHTML=`<h2>History & Exploratory Backtest</h2><div class="card"><p>20-session forward-return study on simple breakout-watch events. Not a validated strategy backtest.</p><div class="row"><input id="btSymbol" value="ORCL"><button class="primary" onclick="backtest()">Run study</button></div><div id="btResult"></div></div><div class="card"><h3>Important exclusions</h3><p>Does not model transaction costs, entry execution, overlapping positions, delisted securities, historical universe membership, or complete corporate actions.</p></div>`},
async alerts(){let s=await api('/status'),a=await api('/alerts');$('app').innerHTML=`<h2>Telegram & Alerts</h2><div class="card"><h3>Connection status: ${s.telegram_configured?'Configured':'Not configured'}</h3><p>Configure TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID in the Render environment before using this feature. This page sends a <strong>manual test only</strong>. No background risk monitoring is active.</p><div class="row"><input id="alertSymbol" value="ORCL"><select id="severity"><option>INFO</option><option>IMPORTANT</option><option>CRITICAL</option></select><button onclick="testAlert()">Send test alert</button></div><p class="muted">Telegram API acceptance does not confirm phone delivery or sound/vibration.</p></div><div class="card"><h3>Notification log</h3>${table(['Date','Symbol','Severity','API accepted'],a.alerts.map(x=>`<tr><td>${esc(x.created)}</td><td>${esc(x.symbol)}</td><td>${esc(x.severity)}</td><td>${x.delivered?'Yes':'No'}</td></tr>`))}</div>`}
};
function sigtable(items,mode='both'){return table(['Ticker','Darvas status','Recovery status','Last price','Base depth (Darvas)','Prior decline (Recovery)','HMA slope','RVOL','Recovery explanation','Data age'],items.map(x=>`<tr><td><button onclick="researchFor('${esc(x.symbol)}')">${esc(x.symbol)}</button></td><td>${esc(x.darvas_stage||'—')}</td><td>${esc(x.recovery_stage||'—')}</td><td>${x.price==null?'—':'$'+fmt(x.price)}</td><td>${x.base_depth_pct==null?'—':fmt(x.base_depth_pct)+'%'}</td><td>${x.prior_decline_pct==null?'—':fmt(x.prior_decline_pct)+'%'}</td><td>${x.hma_slope3_pct==null?'—':fmt(x.hma_slope3_pct)+'%'}</td><td>${fmt(x.rvol20)}</td><td>${esc((x.recovery?.reasons||[]).join('; ')||'—')}</td><td>${x.data_age_days==null?'—':fmt(x.data_age_days)+'d'}</td></tr>`))}
async function download(){
  const btn=$('download');
  if(!btn)return;
  btn.disabled=true;
  const out=$('dlout');
  if(out)out.textContent='Downloading sequentially. This may take several minutes…';
  const symbols=$('syms').value.split(',').map(x=>x.trim()).filter(Boolean);
  const period=$('period').value;
  try{
    const x=await api('/download',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({symbols,period})});
    if(page==='data' && $('dlout')){
      $('dlout').textContent=JSON.stringify(x,null,2);
      // Reload coverage only after the request has finished.
      const s=await api('/status');
      if(page==='data' && $('app')){
        // Keep the download response visible and refresh the coverage table.
        const coverage=$('coverage');
        if(coverage)coverage.innerHTML=table(['Symbol','Bars','First date','Last date'],s.symbols.map(v=>`<tr><td>${esc(v.symbol)}</td><td>${fmt(v.bars)}</td><td>${esc(v.first_day)}</td><td>${esc(v.last_day)}</td></tr>`));
      }
    }
    notice(x.oracle_backup==='ok'?'Download finished and Oracle backup saved.':
      x.oracle_backup==='failed_check_render_logs'?'Download finished, but Oracle backup FAILED. Check Render logs.':'Download finished. Review per-symbol errors.');
  }catch(e){
    notice(e.message,true);
    if(page==='data' && $('dlout'))$('dlout').textContent=e.message;
  }finally{
    if(btn.isConnected)btn.disabled=false;
  }
}
async function upload(){let f=$('portfoliofile').files[0];if(!f)return notice('Select a CSV first',true);let form=new FormData();form.append('file',f);try{let x=await api('/portfolio/import',{method:'POST',body:form});notice('Imported '+x.imported+' positions');go('portfolio')}catch(e){notice(e.message,true)}}
function researchFor(s){cached.researchSymbol=s;go('research')}
async function loadResearch(){let s=$('researchSymbol').value.trim().toUpperCase();if(!/^[A-Z0-9.^-]{1,16}$/.test(s))return notice('Invalid ticker',true);cached.researchSymbol=s;let [r,n,p]=await Promise.all([api('/research/'+encodeURIComponent(s)),api('/notes/'+encodeURIComponent(s)),api('/prices/'+encodeURIComponent(s))]);let sig=r.signal;let bars=p.bars;let body=`<div class="grid"><div class="card"><small>Last stored price</small><div class="metric">${sig.price==null?'—':'$'+fmt(sig.price)}</div><small>${esc(sig.date||'No stored history')}</small></div><div class="card"><small>Screening status</small><div class="metric" style="font-size:18px">${esc(sig.stage||sig.status)}</div><small>${esc(sig.reason)}</small></div><div class="card"><small>HMA38 / ATR14</small><div class="metric" style="font-size:18px">${fmt(sig.hma38)} / ${fmt(sig.atr14)}</div><small>Research-only calculation</small></div></div><div class="card"><h3>Stored daily price history</h3><canvas id="priceChart"></canvas><p class="muted">Not real-time. Prices may contain corporate-action discontinuities.</p></div><div class="card"><h3>Investment thesis notebook</h3><textarea id="noteText">${esc(n.note)}</textarea><p><button onclick="saveNote()">Save note to Oracle cloud</button></p></div><div class="card"><h3>ChatGPT research brief</h3><pre id="brief">${esc(r.brief)}</pre><button onclick="copyBrief()">Copy research brief</button></div>`;$('researchBody').innerHTML=body;if(chart)chart.destroy();if(window.Chart&&bars.length){let tail=bars.slice(-252);chart=new Chart($('priceChart'),{type:'line',data:{labels:tail.map(x=>x.day),datasets:[{label:s+' daily close',data:tail.map(x=>x.close),borderColor:'#6bb7ff',pointRadius:0,borderWidth:2,tension:0}]},options:{responsive:true,scales:{x:{ticks:{maxTicksLimit:10,color:'#aebfd6'}},y:{ticks:{color:'#aebfd6'}}},plugins:{legend:{labels:{color:'#c5d7ef'}}}}})}else if(!window.Chart){$('priceChart').replaceWith(document.createTextNode('Chart library unavailable (CDN blocked). Stored data is still accessible.'))}}
async function saveNote(){try{let result=await api('/notes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({symbol:cached.researchSymbol,text:$('noteText').value})});if(result.saved&&result.oracle_backup==='ok'){notice('Research note saved to SQLite and backed up to Oracle')}else{notice('Note response did not confirm Oracle backup; check storage status',true)}}catch(e){notice(e.message,true)}}function copyBrief(){navigator.clipboard.writeText($('brief').textContent).then(()=>notice('Research brief copied')).catch(()=>notice('Clipboard unavailable; select and copy text manually',true))}
async function backtest(){try{let x=await api('/backtest/'+encodeURIComponent($('btSymbol').value.trim().toUpperCase()));$('btResult').innerHTML=`<pre>${esc(JSON.stringify(x,null,2))}</pre>`}catch(e){notice(e.message,true)}}async function testAlert(){try{let x=await api('/alerts/test',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({symbol:$('alertSymbol').value,severity:$('severity').value,message:'Manual connection test. Not a market signal.'})});notice('Telegram API accepted: '+x.telegram_api_accepted+'. Phone receipt NOT verified.');go('alerts')}catch(e){notice(e.message,true)}}go('home');
</script></body></html>
