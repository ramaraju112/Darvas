:root{font-family:Inter,Segoe UI,Arial,sans-serif;color:#e6edf7;background:#0b1220}*{box-sizing:border-box}body{margin:0}header{padding:18px 24px;background:#101c30;border-bottom:1px solid #26344b;display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}h1{font-size:22px;margin:0}small,.muted{color:#9aabc2}nav{display:flex;gap:6px;flex-wrap:wrap;padding:12px 18px;background:#0e192a;border-bottom:1px solid #26344b}button{background:#233650;color:#eef5ff;border:1px solid #385273;border-radius:8px;padding:10px 13px;cursor:pointer}button:hover{background:#345278}button.active,.primary{background:#2463c7;border-color:#3678e2}button:disabled{opacity:.5;cursor:wait}main{max-width:1400px;margin:auto;padding:22px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.card{border:1px solid #293c55;background:#142238;border-radius:12px;padding:18px;margin-bottom:14px}.card h3{margin-top:0}.metric{font-size:27px;font-weight:700;margin:8px 0}.tag{display:inline-block;padding:5px 9px;border-radius:20px;background:#35465e;font-size:12px}.warn{background:#6d4a1d;color:#ffe3aa}.danger{background:#6a2b3a;color:#ffd7df}.good{background:#1b544a;color:#bdf6e5}input,textarea,select{padding:10px;border-radius:8px;border:1px solid #455a73;background:#0b1729;color:white;max-width:100%;font:inherit}input[type=text]{min-width:240px}textarea{width:100%;min-height:105px}table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:11px;border-bottom:1px solid #2a3a52;text-align:left}th{color:#9aabc2}tr:hover{background:#1c304b}.scroll{overflow:auto}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0b1729;padding:12px;border-radius:8px;color:#bfd6f4}.split{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:850px){.split{grid-template-columns:1fr}}#notice{padding:10px 22px;display:none;background:#254a63}a{color:#86b6ff}canvas{max-height:340px}label{display:block;margin:8px 0}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.spaced{justify-content:space-between}
</style></head><body><header><div><h1>◈ DARVAS V7.4 <span class="tag">BROWSER MVP</span></h1><small>Portfolio Intelligence · Darvas · Early Recovery</small></div><div class="row"><span class="tag warn">RESEARCH ONLY</span><span class="tag">Schwab disconnected</span><span class="tag">No live feed</span></div></header><nav id="nav"></nav><div id="notice"></div><main id="app"></main><script>
const pages=[['home','Command Center'],['data','Market Data'],['darvas','Classic Darvas'],['recovery','Early Recovery Opportunities'],['v75','V7.5 Shadow Research'],['v75scan','V7.5 Market Scan'],['portfolio','Portfolio'],['research','AI Research'],['backtest','History & Backtest'],['alerts','Telegram & Alerts']];let page='home',cached={},chart=null;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=x=>x==null?'—':Number(x).toLocaleString('en-US',{maximumFractionDigits:2});
async function api(path,opts){let r=await fetch('/api'+path,opts);let j=await r.json();if(!r.ok)throw Error(j.detail||r.statusText);return j}function notice(s,bad=false){let e=$('notice');e.textContent=s;e.style.display='block';e.style.background=bad?'#683347':'#254a63'}function nav(){ $('nav').innerHTML=pages.map(([id,name])=>`<button class="${page===id?'active':''}" onclick="go('${id}')">${name}</button>`).join('')}async function go(p){page=p;nav();$('app').innerHTML='<div class="card">Loading…</div>';try{await views[p]()}catch(e){$('app').innerHTML='<div class="card">Error: '+esc(e.message)+'</div>';notice(e.message,true)}}function table(headers,rows){return `<div class="scroll"><table><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.join('')||`<tr><td colspan="${headers.length}">No records yet</td></tr>`}</tbody></table></div>`}
const views={
async home(){let s=await api('/status');let ps=await api('/portfolio');let total=ps.positions.reduce((a,p)=>a+(p.value||0),0),pnl=ps.positions.reduce((a,p)=>a+(p.pnl||0),0);$('app').innerHTML=`<h2>Investment Command Center</h2><div class="grid"><div class="card"><small>Imported portfolio value (last stored close)</small><div class="metric">$${fmt(total)}</div><small>Unrealized P/L: $${fmt(pnl)}</small></div><div class="card"><small>Positions imported</small><div class="metric">${ps.positions.length}</div><small>Protection status: unknown</small></div><div class="card"><small>Symbols stored</small><div class="metric">${s.symbols.length}</div><small>Historical daily OHLCV</small></div><div class="card"><small>Telegram</small><div class="metric">${s.telegram_configured?'Configured':'Offline'}</div><small>No automatic monitoring</small></div></div><div class="split"><div class="card"><h3>Next actions</h3><p>1. Download starter historical prices.</p><p>2. Run research-only scanners.</p><p>3. Import portfolio CSV.</p><p>4. Review charts and research briefs.</p><button class="primary" onclick="go('data')">Start with Market Data</button></div><div class="card"><h3>System limitations</h3><p>Market-wide coverage: <span class="tag warn">Not verified</span></p><p>Schwab order checks: <span class="tag warn">Unavailable</span></p><p>Automated risk alerts: <span class="tag warn">Unavailable</span></p><p>Trading: <span class="tag good">Disabled</span></p><p class="muted">Render Free may spin down after inactivity; automatic monitoring is not enabled.</p></div></div>`},
async data(){let s=await api('/status');$('app').innerHTML=`<h2>Historical Market Data</h2><div class="card"><h3>Download daily OHLCV</h3><p class="muted">Unofficial Yahoo Finance source. Free availability and bulk usage are not guaranteed. Up to 150 symbols per request.</p><label>Symbols (comma separated)</label><input id="syms" type="text" style="width:80%" value="ORCL,ACN,INTC,NKE,SEZL,MSFT,NVDA,PLTR,AMD,META,AMZN,AVGO,SPY,QQQ"><label>History <select id="period"><option>10y</option><option>5y</option><option>2y</option><option>1y</option><option>max</option></select></label><button class="primary" id="download" onclick="download()">Download / update</button><pre id="dlout">No download started.</pre></div><div class="card"><h3>U.S.-listed common-stock universe</h3><p class="muted">The scheduled 4 PM CT job discovers conservatively classified common/ordinary stocks and attempts 10-year backfills in resumable batches. Ambiguous security types are excluded until verified. Manual listing refresh remains available.</p><button onclick="refreshUniverse()">Refresh listed symbols</button> <button onclick="loadUniverse()">Load next 150 symbols</button><p id="universeStatus" class="muted">No universe batch loaded.</p></div><div class="card"><h3>Refresh one stock anytime</h3><p class="muted">Explicit manual refresh only; does not change the strict 4 PM scheduled update.</p><input id="singleTicker" type="text" value="SEZL" placeholder="Ticker"><button onclick="refreshSingleStock()">Refresh Stock</button><pre id="singleResult">Not started.</pre></div><div class="card"><h3>Scheduled sync</h3><p>Weekdays at 4:00 PM America/Chicago (CST/CDT). Eligible U.S. common stocks; initial 10-year history is populated over multiple scheduled sessions. No catch-up outside 4 PM.</p><button onclick="checkSync()">Check sync status</button><pre id="syncResult">No status loaded.</pre></div><div class="card"><h3>Stored data coverage</h3><div id="coverage">${table(['Symbol','Bars','First date','Last date'],s.symbols.map(x=>`<tr><td>${esc(x.symbol)}</td><td>${fmt(x.bars)}</td><td>${esc(x.first_day)}</td><td>${esc(x.last_day)}</td></tr>`))}</div></div>`},
async darvas(){let x=await api('/scan');cached.scan=x;$('app').innerHTML=`<h2>Classic Darvas</h2><p class="tag warn">Independent provisional breakout heuristic — not confirmed classic Darvas pivots</p><div class="grid"><div class="card"><small>Symbols screened</small><div class="metric">${x.scanned}</div></div><div class="card"><small>Darvas breakout watches</small><div class="metric">${x.darvas.length}</div></div></div><div class="card"><h3>Classic Darvas — Top 20 provisional watch</h3><p class="muted">20-session high and base-depth heuristic. Confirmed boxes, pivots and validated entries are not implemented. Early Recovery rules are not used here.</p>${sigtable(x.darvas,'darvas')}</div><div class="card"><h3>First 250 symbols — Darvas screening</h3>${sigtable(x.all,'darvas')}</div>`},
async recovery(){let x=await api('/scan');cached.scan=x;$('app').innerHTML=`<h2>Early Recovery Opportunities</h2><p class="tag warn">Independent provisional recovery research — not trading signals</p><div class="grid"><div class="card"><small>Symbols screened</small><div class="metric">${x.scanned}</div></div><div class="card"><small>Recovery discoveries</small><div class="metric">${(x.recovery_discovery||[]).length}</div></div><div class="card"><small>Volume-confirmed recovery watches</small><div class="metric">${x.recovery.length}</div></div></div><div class="card"><h3>Recovery discovery</h3><p class="muted">Decline ≥20%, rising HMA38, price above HMA38. No Darvas box requirement.</p>${sigtable(x.recovery_discovery||[],'recovery')}</div><div class="card"><h3>Volume-confirmed recovery watches</h3><p class="muted">Discovery candidates with RVOL20 ≥1.0; not entry signals.</p>${sigtable(x.recovery,'recovery')}</div><div class="card"><h3>First 250 symbols — Recovery screening</h3>${sigtable(x.all,'recovery')}</div>`},
async v75scan(){ $('app').innerHTML=`<h2>V7.5 — Independent Market Scan</h2><p class="tag warn">Research only · stored symbols · no trading recommendations</p><div class="card"><h3>Read-only paginated V7.5 evaluation</h3><p class="muted">Processes eligible stocks with stored OHLCV in batches of 20. This does not download prices or update Oracle. Do not interpret incomplete coverage as zero opportunities.</p><button id="v75scanBtn" class="primary" onclick="runV75Scan()">Scan all stored eligible stocks</button><p id="v75scanProgress" class="muted">Not started</p></div><div class="grid" id="v75scanStats"></div><div class="card"><h3>Classic Darvas — qualifying stages</h3><div id="v75classicResults">Run scan to see results.</div></div><div class="card"><h3>Early Recovery — decline, stabilization and emerging stages</h3><div id="v75recoveryResults">Run scan to see results.</div></div><div class="card"><h3>Calculation errors and incomplete histories</h3><div id="v75scanErrors">Not started</div></div>`;},
 async v75(){$('app').innerHTML=`<h2>Darvas V7.5 — Shadow Research</h2><p class="tag warn">Experimental research only · not a market-wide scan · no trading signals</p><div class="card"><h3>Compare both independent V7.5 engines</h3><p class="muted">Uses saved daily price history. Classic Darvas and Early Recovery are calculated independently; a decline-monitor candidate is not a buy signal.</p><div class="row"><input id="v75Ticker" type="text" value="${esc(cached.v75Ticker||'ORCL')}" placeholder="Ticker"><button class="primary" onclick="loadV75()">Analyze V7.5</button></div><div id="v75Result" style="margin-top:16px">Enter a symbol to inspect its stored history.</div></div><div class="card"><h3>V7.5 rollout status</h3><p>Individual-symbol shadow endpoint: available if deployed.</p><p>Market-wide V7.5 ranking and dashboard: not yet implemented.</p><p>Existing V7.4 scan, portfolio, notes, downloads and Oracle backups remain unchanged.</p></div>`;await loadV75()},
async portfolio(){let x=await api('/portfolio');$('app').innerHTML=`<h2>Portfolio Intelligence</h2><div class="card"><h3>Import Schwab-style CSV</h3><p>Required headers: <code>symbol,quantity,cost_basis</code>. Optional: <code>horizon,thesis</code>. Import replaces the previous local portfolio. No brokerage login required.</p><input id="portfoliofile" type="file" accept=".csv"><button class="primary" onclick="upload()">Import CSV</button><p class="muted">You can test using sample_portfolio.csv included in the ZIP.</p></div><div class="card"><h3>All imported holdings</h3>${table(['Ticker','Shares','Avg cost','Last price','Price date','Value','P/L','Protection'],x.positions.map(p=>`<tr><td><button onclick="researchFor('${esc(p.symbol)}')">${esc(p.symbol)}</button></td><td>${fmt(p.quantity)}</td><td>$${fmt(p.cost_basis)}</td><td>${p.price==null?'—':'$'+fmt(p.price)}</td><td>${esc(p.price_date||'No price')}</td><td>${p.value==null?'—':'$'+fmt(p.value)}</td><td>${p.pnl==null?'—':'$'+fmt(p.pnl)}</td><td><span class="tag warn">UNKNOWN</span></td></tr>`))}</div><p class="muted">Stored closes are not live quotes. No stops or working orders are connected; no intraday protection is provided.</p>`},
async research(){let symbol=cached.researchSymbol||'ORCL';$('app').innerHTML=`<h2>Research Notebook</h2><div class="card"><div class="row"><input type="text" id="researchSymbol" value="${esc(symbol)}" placeholder="Ticker"><button onclick="loadResearch()">Load research</button></div><div id="researchBody" style="margin-top:15px"></div></div>`;await loadResearch()},
async backtest(){$('app').innerHTML=`<h2>History & Exploratory Backtest</h2><div class="card"><p>20-session forward-return study on simple breakout-watch events. Not a validated strategy backtest.</p><div class="row"><input id="btSymbol" value="ORCL"><button class="primary" onclick="backtest()">Run study</button></div><div id="btResult"></div></div><div class="card"><h3>Important exclusions</h3><p>Does not model transaction costs, entry execution, overlapping positions, delisted securities, historical universe membership, or complete corporate actions.</p></div>`},
async alerts(){let s=await api('/status'),a=await api('/alerts');$('app').innerHTML=`<h2>Telegram & Alerts</h2><div class="card"><h3>Connection status: ${s.telegram_configured?'Configured':'Not configured'}</h3><p>Configure TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID in the Render environment before using this feature. This page sends a <strong>manual test only</strong>. No background risk monitoring is active.</p><div class="row"><input id="alertSymbol" value="ORCL"><select id="severity"><option>INFO</option><option>IMPORTANT</option><option>CRITICAL</option></select><button onclick="testAlert()">Send test alert</button></div><p class="muted">Telegram API acceptance does not confirm phone delivery or sound/vibration.</p></div><div class="card"><h3>Notification log</h3>${table(['Date','Symbol','Severity','API accepted'],a.alerts.map(x=>`<tr><td>${esc(x.created)}</td><td>${esc(x.symbol)}</td><td>${esc(x.severity)}</td><td>${x.delivered?'Yes':'No'}</td></tr>`))}</div>`}
};
function sigtable(items,mode='both'){const darvas=mode==='darvas';const headers=darvas?['Ticker','Darvas status','Last price','Base depth','Prior high','RVOL','Data age']:['Ticker','Recovery status','Last price','Prior decline','HMA slope','RVOL','Recovery explanation','Data age'];return table(headers,items.map(x=>darvas?`<tr><td><button onclick="researchFor('${esc(x.symbol)}')">${esc(x.symbol)}</button></td><td>${esc(x.darvas_stage||'—')}</td><td>${x.price==null?'—':'$'+fmt(x.price)}</td><td>${x.base_depth_pct==null?'—':fmt(x.base_depth_pct)+'%'}</td><td>${fmt(x.darvas?.prior_high)}</td><td>${fmt(x.rvol20)}</td><td>${fmt(x.data_age_days)}d</td></tr>`:`<tr><td><button onclick="researchFor('${esc(x.symbol)}')">${esc(x.symbol)}</button></td><td>${esc(x.recovery_stage||'—')}</td><td>${x.price==null?'—':'$'+fmt(x.price)}</td><td>${fmt(x.prior_decline_pct)}%</td><td>${fmt(x.hma_slope3_pct)}%</td><td>${fmt(x.rvol20)}</td><td>${esc((x.recovery?.reasons||[]).join('; ')||'—')}</td><td>${fmt(x.data_age_days)}d</td></tr>`))}
 let v75MarketResults=[];
async function runV75Scan(){
 const btn=$('v75scanBtn');btn.disabled=true;v75MarketResults=[];
 let offset=0,total=null;
 try{
   do{
     const batch=await api('/v75/scan?offset='+offset+'&limit=20');
     total=batch.total_stored_eligible;
     v75MarketResults.push(...batch.results);
     offset=batch.next_offset;
     if($('v75scanProgress'))$('v75scanProgress').textContent='Evaluated '+v75MarketResults.length+' / '+total+' stored eligible symbols…';
     if(page!=='v75scan')return;
   }while(offset!==null);
   const good=v75MarketResults.filter(x=>x.status==='SHADOW_RESEARCH_ONLY');
   const classic=good.filter(x=>x.classic && (x.classic.watch || !['NONE','DATA_INCOMPLETE','BOX_FORMING','TREND_CANDIDATE'].includes(x.classic.stage)));
   const recovery=good.filter(x=>x.recovery && !['NONE','DATA_INCOMPLETE','DECLINE_MONITOR','RECOVERY_FAILED'].includes(x.recovery.stage));
   const declines=good.filter(x=>x.recovery?.stage==='DECLINE_MONITOR' && (x.recovery?.prior_decline_pct||0)>=15);
   const problems=v75MarketResults.filter(x=>x.status!=='SHADOW_RESEARCH_ONLY');
   const sortScore=(a,b)=>(b.recovery?.score||0)-(a.recovery?.score||0);
   const render=(items,engine)=>table(['Ticker','Stage','Score / 100','Stored date','Age (days)','Explanation'],items.map(x=>`<tr><td><button onclick="researchFor('${esc(x.symbol)}')">${esc(x.symbol)}</button></td><td>${esc(x[engine]?.stage||'—')}</td><td>${fmt(x[engine]?.score)}</td><td>${esc(x.date||'—')}</td><td>${fmt(x.data_age_days)}</td><td>${esc((x[engine]?.reasons||[]).join('; '))}</td></tr>`));
   $('v75scanStats').innerHTML=`<div class="card"><small>Stored eligible symbols evaluated</small><div class="metric">${good.length} / ${total}</div></div><div class="card"><small>Classic qualifying stages</small><div class="metric">${classic.length}</div></div><div class="card"><small>Recovery stabilization/emerging</small><div class="metric">${recovery.length}</div></div><div class="card"><small>Decline monitors ≥15%</small><div class="metric">${declines.length}</div></div>`;
   $('v75classicResults').innerHTML=render(classic.sort((a,b)=>(b.classic?.score||0)-(a.classic?.score||0)),'classic');
   $('v75recoveryResults').innerHTML='<h4>Stabilization / Emerging</h4>'+render(recovery.sort(sortScore),'recovery')+'<h4>Decline Monitor (research only)</h4>'+render(declines.sort((a,b)=>(b.recovery?.prior_decline_pct||0)-(a.recovery?.prior_decline_pct||0)),'recovery');
   $('v75scanErrors').innerHTML=render(problems,'recovery');
   $('v75scanProgress').textContent='Complete: '+v75MarketResults.length+' stored eligible symbols checked. Market-wide coverage not verified.';
 }catch(e){if($('v75scanProgress'))$('v75scanProgress').textContent='Scan stopped after '+v75MarketResults.length+' symbols: '+e.message;notice(e.message,true)}
 finally{if(btn.isConnected)btn.disabled=false;}
}
async function loadV75(){const input=$('v75Ticker'),out=$('v75Result');if(!input||!out)return;const symbol=input.value.trim().toUpperCase();if(!/^[A-Z0-9.^-]{1,16}$/.test(symbol)){out.textContent='Invalid ticker';return}cached.v75Ticker=symbol;out.textContent='Loading V7.5 research…';try{const x=await api('/v75/shadow/'+encodeURIComponent(symbol));const classic=x.classic||{},recovery=x.recovery||{};const items=[['Classic Darvas',classic],['Early Recovery',recovery]];const cards=items.map(([name,v])=>`<div class="card"><h3>${name}</h3><div class="metric" style="font-size:21px">${esc(v.stage||'UNKNOWN')}</div><p>Provisional score: <strong>${v.score==null?'Not available':fmt(v.score)+'/100'}</strong></p><p class="muted">${esc((v.reasons||[]).join('; ')||'No explanation supplied')}</p></div>`).join('');out.innerHTML=`<p><strong>${esc(x.symbol||symbol)}</strong> · ${esc(x.date||'Date unavailable')} · ${fmt(x.bars)} daily bars · ${esc(x.version||'V7.5 shadow')}</p><div class="split">${cards}</div><div class="card"><h3>Early Discovery evidence</h3><p>Prior decline: ${recovery.prior_decline_pct==null?'—':fmt(recovery.prior_decline_pct)+'%'} · Support: ${recovery.support==null?'—':'$'+fmt(recovery.support)} · RVOL20: ${fmt(recovery.rvol20)}</p><p>Relative strength: ${esc(recovery.relative_strength_status||'Not reported')}</p><p class="muted">${esc(x.warning||'Experimental shadow calculation; verify data freshness and completeness.')}</p><button onclick="researchFor('${symbol}')">Open existing research notebook</button></div>`}catch(e){out.innerHTML='<p class="tag danger">V7.5 endpoint unavailable: '+esc(e.message)+'</p><p class="muted">The original V7.4 dashboard remains functional.</p>'}}
async function refreshSingleStock(){let s=($('singleTicker')?.value||'').trim().toUpperCase();if(!/^[A-Z0-9.^-]{1,16}$/.test(s))return notice('Invalid ticker',true);let el=$('singleResult');el.textContent='Refreshing '+s+'...';try{let r=await api('/stock/refresh/'+encodeURIComponent(s),{method:'POST'});el.textContent=JSON.stringify(r,null,2);notice(r.oracle_backup==='ok'?'Stock refreshed and Oracle backed up.':'Review backup status',r.oracle_backup!=='ok')}catch(e){el.textContent=e.message;notice(e.message,true)}}
async function checkSync(){try{$('syncResult').textContent=JSON.stringify(await api('/sync/status'),null,2)}catch(e){notice(e.message,true)}}
let universeOffset=0;
async function refreshUniverse(){try{notice('Fetching exchange symbol directories...');let x=await api('/universe/refresh',{method:'POST'});universeOffset=0;let el=$('universeStatus');if(el)el.textContent=`${x.eligible} eligible common stocks from ${x.listed} directory entries. ${x.errors.length?'Some sources failed: '+x.errors.join('; '):'Ready for batches.'}`;notice('Universe refreshed. Listing is not price history.')}catch(e){notice('Universe refresh failed: '+e.message,true)}}
async function loadUniverse(){try{let x=await api('/universe?offset='+universeOffset+'&limit=150');if(!x.total){notice('Refresh listed symbols first.',true);return}if(!x.symbols.length){universeOffset=0;notice('Reached end of universe; next batch starts from beginning.');return}let input=$('syms');if(input)input.value=x.symbols.map(v=>v.symbol).join(',');universeOffset+=x.symbols.length;let el=$('universeStatus');if(el)el.textContent=`Loaded symbols ${x.offset+1}–${x.offset+x.symbols.length} of ${x.total}. Click Download / update to fetch this batch (up to 150).`;notice('Loaded next symbol batch. No price download has started.')}catch(e){notice(e.message,true)}}
async function download(){
  const btn=$('download');
  if(!btn)return;
  btn.disabled=true;
  const out=$('dlout');
  if(out)out.textContent='Downloading sequentially. This may take several minutes…';
  const symbols=$('syms').value.split(',').map(x=>x.trim()).filter(Boolean);
  const period=$('period').value;
  try{
    const x=await api('/download',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({symbols,period})});
    if(page==='data' && $('dlout')){
      $('dlout').textContent=JSON.stringify(x,null,2);
      // Reload coverage only after the request has finished.
      const s=await api('/status');
      if(page==='data' && $('app')){
        // Keep the download response visible and refresh the coverage table.
        const coverage=$('coverage');
        if(coverage)coverage.innerHTML=table(['Symbol','Bars','First date','Last date'],s.symbols.map(v=>`<tr><td>${esc(v.symbol)}</td><td>${fmt(v.bars)}</td><td>${esc(v.first_day)}</td><td>${esc(v.last_day)}</td></tr>`));
      }
    }
    notice(x.oracle_backup==='ok'?'Download finished and Oracle backup saved.':
      x.oracle_backup==='failed_check_render_logs'?'Download finished, but Oracle backup FAILED. Check Render logs.':'Download finished. Review per-symbol errors.');
  }catch(e){
    notice(e.message,true);
    if(page==='data' && $('dlout'))$('dlout').textContent=e.message;
  }finally{
    if(btn.isConnected)btn.disabled=false;
  }
}
async function upload(){let f=$('portfoliofile').files[0];if(!f)return notice('Select a CSV first',true);let form=new FormData();form.append('file',f);try{let x=await api('/portfolio/import',{method:'POST',body:form});notice('Imported '+x.imported+' positions');go('portfolio')}catch(e){notice(e.message,true)}}
function researchFor(s){cached.researchSymbol=s;go('research')}
async function loadResearch(){let s=$('researchSymbol').value.trim().toUpperCase();if(!/^[A-Z0-9.^-]{1,16}$/.test(s))return notice('Invalid ticker',true);cached.researchSymbol=s;let [r,n,p]=await Promise.all([api('/research/'+encodeURIComponent(s)),api('/notes/'+encodeURIComponent(s)),api('/prices/'+encodeURIComponent(s))]);let sig=r.signal;let bars=p.bars;let body=`<div class="grid"><div class="card"><small>Last stored price</small><div class="metric">${sig.price==null?'—':'$'+fmt(sig.price)}</div><small>${esc(sig.date||'No stored history')}</small></div><div class="card"><small>Screening status</small><div class="metric" style="font-size:18px">${esc(sig.stage||sig.status)}</div><small>${esc(sig.reason)}</small></div><div class="card"><small>HMA38 / ATR14</small><div class="metric" style="font-size:18px">${fmt(sig.hma38)} / ${fmt(sig.atr14)}</div><small>Research-only calculation</small></div></div><div class="card"><h3>Stored daily price history</h3><canvas id="priceChart"></canvas><p class="muted">Not real-time. Prices may contain corporate-action discontinuities.</p></div><div class="card"><h3>Investment thesis notebook</h3><textarea id="noteText">${esc(n.note)}</textarea><p><button onclick="saveNote()">Save note to Oracle cloud</button></p></div><div class="card"><h3>ChatGPT research brief</h3><pre id="brief">${esc(r.brief)}</pre><button onclick="copyBrief()">Copy research brief</button></div>`;$('researchBody').innerHTML=body;if(chart)chart.destroy();if(window.Chart&&bars.length){let tail=bars.slice(-252);chart=new Chart($('priceChart'),{type:'line',data:{labels:tail.map(x=>x.day),datasets:[{label:s+' daily close',data:tail.map(x=>x.close),borderColor:'#6bb7ff',pointRadius:0,borderWidth:2,tension:0}]},options:{responsive:true,scales:{x:{ticks:{maxTicksLimit:10,color:'#aebfd6'}},y:{ticks:{color:'#aebfd6'}}},plugins:{legend:{labels:{color:'#c5d7ef'}}}}})}else if(!window.Chart){$('priceChart').replaceWith(document.createTextNode('Chart library unavailable (CDN blocked). Stored data is still accessible.'))}}
async function saveNote(){try{let result=await api('/notes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({symbol:cached.researchSymbol,text:$('noteText').value})});if(result.saved&&result.oracle_backup==='ok'){notice('Research note saved to SQLite and backed up to Oracle')}else{notice('Note response did not confirm Oracle backup; check storage status',true)}}catch(e){notice(e.message,true)}}function copyBrief(){navigator.clipboard.writeText($('brief').textContent).then(()=>notice('Research brief copied')).catch(()=>notice('Clipboard unavailable; select and copy text manually',true))}
async function backtest(){try{let x=await api('/backtest/'+encodeURIComponent($('btSymbol').value.trim().toUpperCase()));$('btResult').innerHTML=`<pre>${esc(JSON.stringify(x,null,2))}</pre>`}catch(e){notice(e.message,true)}}async function testAlert(){try{let x=await api('/alerts/test',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({symbol:$('alertSymbol').value,severity:$('severity').value,message:'Manual connection test. Not a market signal.'})});notice('Telegram API accepted: '+x.telegram_api_accepted+'. Phone receipt NOT verified.');go('alerts')}catch(e){notice(e.message,true)}}go('home');
</script></body></html>
