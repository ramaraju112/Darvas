name: Darvas V6 - Five Year Multi-Box Backtest (Manual)
on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Number of symbols (0 = all 400; use 5 for first smoke test)'
        required: true
        default: '5'
      period:
        description: 'Historical data period'
        required: true
        type: choice
        default: '5y'
        options: ['1y', '2y', '5y']
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_v6.txt
      - name: Verify files and run tests
        run: |
          test -s symbols.txt
          python -m py_compile darvas_v6_backtest.py darvas_fresh_v4.py
          python -m unittest -v test_v6_backtest.py
      - name: Run V6 multi-box backtest
        env:
          LIMIT: ${{ inputs.limit }}
          PERIOD: ${{ inputs.period }}
        run: |
          python -u darvas_v6_backtest.py --symbols symbols.txt --period "$PERIOD" --limit "$LIMIT" --output darvas_v6_backtest_report.xlsx
      - name: Upload workbook
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: darvas-v6-multibox-backtest-${{ github.run_number }}
          path: darvas_v6_backtest_report.xlsx
          if-no-files-found: warn
          retention-days: 30
