name: Darvas V6 Review - Manual Portfolio and V5 Baseline
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'portfolio = V6 ledger + V5 monitor; scan/backtest = V5 baseline only'
        type: choice
        required: true
        default: portfolio
        options: [portfolio, scan, backtest]
permissions:
  contents: write
concurrency:
  group: darvas-v6-review-state
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
       - uses: actions/setup-python@v6
  with:
    python-version: '3.11'
    cache: pip
    cache-dependency-path: requirements_v6.txt
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements_v6.txt
      - name: Run selected operation
        env:
          MODE: ${{ inputs.mode }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          if [ "$MODE" = portfolio ]; then
            test -s existing_dar_stocks.txt
            python darvas_fresh_v4.py --mode monitor
            python darvas_v6_portfolio.py --telegram
          elif [ "$MODE" = scan ]; then
            python darvas_fresh_v4.py --mode scan --days 10
            python darvas_v5_excel.py --mode scan
          elif [ "$MODE" = backtest ]; then
            python darvas_fresh_v4.py --mode backtest --period 5y
            python darvas_v5_backtest_excel.py
          fi
      - name: Persist only deduplication state
        if: success() && inputs.mode == 'portfolio'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v6_alert_state.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: persist Darvas V6 alert state'
            git push
          fi
      - name: Upload generated reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: darvas-v6-review-${{ inputs.mode }}-${{ github.run_id }}
          path: |
            v6_reports/
            darvas_v4_*results.csv
            darvas_v5_*report.xlsx
          if-no-files-found: warn
