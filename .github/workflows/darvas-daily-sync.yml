name: Darvas V7.4 — 4:10 PM CT (Nov 17 8:30 PM exception)

on:
  schedule:
    # Normal 4:10 PM Central on weekdays, CST/CDT respectively.
    # Python runner and API reject the other DST trigger.
    - cron: '10 21 * * 1-5'
    - cron: '10 22 * * 1-5'
    # Tue Nov 17 2026 8:30 PM CST = Wed Nov 18 02:30 UTC.
    # GitHub cron syntax is recurring yearly; the Python guard
    # allows this only on local Nov 17 2026, 8:30–9:00 PM CT.
    - cron: '30 2 18 11 *'
  # No workflow_dispatch: no manual sync.

permissions:
  contents: read

concurrency:
  group: darvas-full-market-sync
  cancel-in-progress: false

jobs:
  daily-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Scheduled Central-time updater
        env:
          DARVAS_APP_URL: https://darvas-v74.onrender.com
          DARVAS_SYNC_TOKEN: ${{ secrets.DARVAS_SYNC_TOKEN }}
        run: python v7_4/Scripts/daily_sync.py
