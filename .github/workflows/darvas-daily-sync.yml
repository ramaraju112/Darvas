name: Darvas V7.4 — Weekday 4 PM Central Sync

on:
  schedule:
    # 22:10 UTC = 4:10 PM CST / 5:10 PM CDT, always after close.
    - cron: '10 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: darvas-v74-market-sync
  cancel-in-progress: false

jobs:
  daily-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Resumable market data updater
        env:
          DARVAS_APP_URL: https://darvas-v74.onrender.com
          DARVAS_SYNC_TOKEN: ${{ secrets.DARVAS_SYNC_TOKEN }}
        run: python v7_4/Scripts/daily_sync.py
