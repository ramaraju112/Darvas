name: Darvas V6 - Five Year Multi-Box Backtest (Manual)

on:
  workflow_dispatch:
    inputs:
      period:
        description: 'Yahoo Finance historical data period'
        required: true
        type: choice
        default: '5y'
        options: ['1y', '2y', '5y', '10y']
      limit:
        description: 'Maximum symbols; 0 means all symbols.txt entries'
        required: true
        type: number
        default: 0

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Validate files and Python syntax
        run: |
          set -euo pipefail
          for f in requirements_v6.txt darvas_v6_backtest.py darvas_fresh_v4.py symbols.txt; do
            test -f "$f" || { echo "::error::Missing $f"; exit 1; }
          done
          test -s symbols.txt || { echo '::error::symbols.txt is empty'; exit 1; }
          python -m py_compile darvas_v6_backtest.py darvas_fresh_v4.py

      - name: Install backtest dependencies
        run: |
          set -euo pipefail
          python -m pip install -r requirements_v6.txt --prefer-binary
          python -c 'import pandas, numpy, yfinance, artifact_tool; print("Dependencies imported")'

      - name: Run five-year multi-box backtest
        env:
          TEST_PERIOD: ${{ inputs.period }}
          LIMIT: ${{ inputs.limit }}
        run: |
          set -euo pipefail
          python darvas_v6_backtest.py \
            --symbols symbols.txt \
            --period "$TEST_PERIOD" \
            --limit "$LIMIT" \
            --output darvas_v6_backtest_report.xlsx

      - name: Upload backtest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: darvas-v6-backtest-${{ github.run_id }}
          path: darvas_v6_backtest_report.xlsx
          if-no-files-found: warn
          retention-days: 30
