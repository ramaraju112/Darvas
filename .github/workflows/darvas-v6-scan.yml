name: Darvas V6.2 Intraday and Daily Scan
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: Scan mode
        required: true
        default: intraday
        options: [intraday, daily]
  schedule:
    # UTC hours span US daylight/standard time; gate below uses America/Chicago.
    - cron: '0,30 14-20 * * 1-5'
    - cron: '15 21 * * 1-5'
permissions:
  contents: write
concurrency:
  group: darvas-v62-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r v6_2/requirements_v62.txt
      - name: Choose mode and check US market window
        id: session
        env:
          EVENT: ${{ github.event_name }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          python - <<'PY'
          import datetime,os
          from zoneinfo import ZoneInfo
          from pathlib import Path
          now=datetime.datetime.now(ZoneInfo('America/Chicago'))
          manual=os.environ['EVENT']=='workflow_dispatch'
          mins=now.hour*60+now.minute
          # Monday-Friday; scheduled jobs outside 08:45-15:40 CT are skipped.
          enabled=manual or (now.weekday()<5 and 8*60+45<=mins<=15*60+40)
          mode=os.environ.get('INPUT_MODE') or ('daily' if mins>=15*60+5 else 'intraday')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f'enabled={str(enabled).lower()}\nmode={mode}\n')
          print('Local time',now,'enabled',enabled,'mode',mode)
          PY
      - name: Scan
        if: steps.session.outputs.enabled == 'true'
        run: |
          test -s symbols_v6_1500.txt || { echo 'Run weekly universe workflow first'; exit 1; }
          python darvas_v62.py scan --mode '${{ steps.session.outputs.mode }}'
      - name: Upload report
        if: always() && steps.session.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: darvas-v62-${{ steps.session.outputs.mode }}-${{ github.run_id }}
          path: |
            darvas_v62_report.xlsx
            darvas_v62_signal_state.json
      - name: Save latest statuses for next run
        if: success() && steps.session.outputs.enabled == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add darvas_v62_signal_state.json
          if ! git diff --cached --quiet; then git commit -m 'chore: update V6.2 signal state'; git pull --rebase; git push; fi
